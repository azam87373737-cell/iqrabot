name: IQRA Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Code Uthao
        uses: actions/checkout@v4

      - name: Python Lagao
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zaroori Cheezein Install Karo
        run: pip install -r requirements.txt
